name: Google Play Production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: google-play-production
  cancel-in-progress: false

jobs:
  promote-tested-release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Play API dependencies
        run: python -m pip install google-auth==2.40.3 requests==2.32.4
      - name: Promote identical tested Internal release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/closed-testing.yml/runs?branch=feature%2Fclosed-testing-pipeline&status=success&per_page=100" > "$RUNNER_TEMP/internal-runs.json"
          python tools/release/promote-production.py
